name: Tarkista jalleenmyyntiliput

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ticket-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna riippuvuudet
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Tarkista liput
        env:
          EVENT_URL: ${{ vars.EVENT_URL }}
          EVENT_LABEL: ${{ vars.EVENT_LABEL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python3 check_tickets.py

      - name: Tallenna tila
        if: always()
        run: |
          git config user.name "ticket-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Paivita tila [skip ci]"
          git push
